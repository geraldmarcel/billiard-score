<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billiard Live Scoreboard - Multi Device</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { 
    --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --sub: #86868b;
    --border: #d2d2d7; --primary: #0071e3; --accent: #f5f5f7;
    --win: #34c759; --hill: #ff9500;
  }

  [data-theme="dark"] {
    --bg: #000000; --card: #1c1c1e; --text: #f5f5f7; --sub: #a1a1a6;
    --border: #38383a; --primary: #0a84ff; --accent: #2c2c2e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px; transition: 0.3s; line-height: 1.5; }
  .container { max-width: 700px; margin: 0 auto; }
  
  .nav-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
  .back-btn { text-decoration: none; color: var(--sub); font-size: 13px; font-weight: 600; cursor: pointer; }
  
  .card { background: var(--card); padding: 24px; border-radius: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid var(--border); }
  h2 { font-size: 18px; font-weight: 800; margin-bottom: 15px; }
  
  .input-group { display: flex; flex-direction: column; margin-bottom: 15px; }
  label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--sub); margin-bottom: 6px; letter-spacing: 0.5px; }
  input { background: var(--accent); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 12px; outline: none; font-size: 14px; width: 100%; }
  
  .flex-row { display: flex; gap: 12px; }
  .btn { padding: 12px 20px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 14px; width: 100%; }
  .btn-sec { background: var(--accent); color: var(--text); border: 1px solid var(--border); }
  
  /* Player tags */
  .player-tags-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .player-tag { background: var(--accent); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .remove-player { color: #ff3b30; cursor: pointer; font-weight: 800; }

  /* Gameboard */
  .meta-info { text-align: center; margin-bottom: 15px; font-size: 13px; font-weight: 700; color: var(--sub); }
  .timer-display { text-align: center; font-size: 36px; font-weight: 800; font-family: monospace; margin: 10px 0; color: var(--primary); }
  .stats-mini { text-align: center; font-size: 12px; color: var(--sub); margin-bottom: 20px; font-weight: 600; }
  
  .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
  @media (max-width: 480px) { .cards-grid { grid-template-columns: 1fr; } }
  
  .player-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; position: relative; transition: 0.3s; }
  .player-name { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .player-location { font-size: 11px; color: var(--sub); margin-bottom: 15px; font-weight: 600; }
  .score-display { font-size: 64px; font-weight: 800; margin-bottom: 15px; font-family: 'Inter', sans-serif; }
  .btn-score { padding: 12px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; width: 100%; cursor: pointer; }
  
  /* Status Card */
  .player-card.on-the-hill { border-color: var(--hill); box-shadow: 0 0 15px rgba(255, 149, 0, 0.2); }
  .player-card.winner { border-color: var(--win); background: rgba(52, 199, 89, 0.05); }
  .player-card.winner .score-display { color: var(--win); }

  .hidden { display: none !important; }
  .hide-on-screenshot #btn-zone, 
  .hide-on-screenshot .nav-top { display: none !important; }
</style>
</head>
<body>

<div class="container" id="full-page-zone">
  <div class="nav-top">
    <span class="back-btn" id="btn-back">← Back to Home</span>
    <span style="font-size: 12px; font-weight: 700; color: var(--sub);" id="room-indicator">Room: default</span>
  </div>

  <div id="setup-section" class="card">
    <h2>🎱 Setup New Live Match</h2>
    <div class="input-group">
      <label>Room / Meja ID (Untuk Multi Device)</label>
      <input type="text" id="input-room-id" placeholder="Contoh: meja-1, tanding-pro">
    </div>
    <div class="input-group">
      <label>Arena Name / Location</label>
      <input type="text" id="input-location" placeholder="e.g. Dungeon Pool, Hongdae">
    </div>
    <div class="input-group">
      <label>Target Race To</label>
      <input type="number" id="input-race" value="5" min="1">
    </div>
    <div class="input-group">
      <label>Add Player</label>
      <div class="flex-row">
        <input type="text" id="input-player-name" placeholder="Enter player name...">
        <button class="btn" style="width: auto;" id="btn-add-player">Add</button>
      </div>
      <div class="player-tags-container" id="player-list-preview"></div>
    </div>
    <button class="btn" style="margin-top: 15px;" id="btn-start-race">Initiate Live Race</button>
  </div>

  <div id="gameboard-section" class="hidden">
    <div class="meta-info" id="race-meta">📍 Arena Name | 🏁 Race To: 0</div>
    <div class="timer-display" id="global-timer">00:00.00</div>
    <div class="stats-mini">Avg Pace: <span id="global-avg-value">-</span> per point</div>
    
    <div class="cards-grid" id="cards-container"></div>
    
    <div class="flex-row" id="btn-zone">
      <button class="btn btn-sec" id="btn-reset">Reset Game</button>
      <button class="btn hidden" id="btn-share-node">📸 Share Result</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getDatabase, ref, set, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCtlTm-HxYxa4f_Ypf-b-cs7zCnqWb5Tq4",
  authDomain: "billiard-2b803.firebaseapp.com",
  databaseURL: "https://billiard-2b803-default-rtdb.firebaseio.com",
  projectId: "billiard-2b803",
  storageBucket: "billiard-2b803.firebasestorage.app",
  messagingSenderId: "444434542940",
  appId: "1:444434542940:web:74b12f78ea71bd54f3d199"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Baca Room ID dari link URL (?room=id_meja)
const urlParams = new URLSearchParams(window.location.search);
let roomId = urlParams.get('room') || '';

let dbRoomPath = roomId ? `billiard_live_scoreboard/${roomId}` : null;

let tempPlayers = []; 
let playersData = [];
let raceTo = 0;
let locationName = "";
let totalMatchPoints = 0;

let matchStartTime = null;
let matchElapsedTime = 0;
let globalTimerInterval = null;
let isGameOver = false;

// Tema gelap/terang otomatis
const savedTheme = localStorage.getItem('billiard-theme') || 'light';
document.body.setAttribute('data-theme', savedTheme);

if (roomId) {
    document.getElementById('room-indicator').innerText = `Room: ${roomId}`;
    startListeningToFirebase();
} else {
    document.getElementById('room-indicator').innerText = `Room: Not Connected`;
}

// FUNGSI UTAMA SINKRONISASI REAL-TIME MULTI DEVICE
function startListeningToFirebase() {
    if (!dbRoomPath) return;
    
    onValue(ref(db, dbRoomPath), (snapshot) => {
        const data = snapshot.val();
        if (data) {
            playersData = data.playersData || [];
            raceTo = data.raceTo || 0;
            locationName = data.locationName || "";
            totalMatchPoints = data.totalMatchPoints || 0;
            matchElapsedTime = data.matchElapsedTime || 0;
            isGameOver = data.isGameOver || false;

            document.getElementById('race-meta').innerText = `📍 ${locationName}  |  🏁 Race To: ${raceTo}`;
            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('gameboard-section').classList.remove('hidden');
            
            renderCardsFromFirebase();
            updateGlobalStatsUI();

            if (data.isTimerRunning && !globalTimerInterval && !isGameOver) {
                matchStartTime = Date.now() - matchElapsedTime;
                globalTimerInterval = setInterval(() => {
                    matchElapsedTime = Date.now() - matchStartTime;
                    document.getElementById('global-timer').innerText = formatTime(matchElapsedTime);
                }, 10);
            } else if (!data.isTimerRunning || isGameOver) {
                clearInterval(globalTimerInterval);
                globalTimerInterval = null;
                document.getElementById('global-timer').innerText = formatTime(matchElapsedTime);
            }

            if (isGameOver) {
                document.getElementById('btn-share-node').classList.remove('hidden');
            } else {
                document.getElementById('btn-share-node').classList.add('hidden');
            }
        } else {
            // Jika data di-reset atau tidak ada
            clearInterval(globalTimerInterval);
            globalTimerInterval = null;
            document.getElementById('gameboard-section').classList.add('hidden');
            document.getElementById('setup-section').classList.remove('hidden');
        }
    });
}

function addPlayerToList() {
    const inputElement = document.getElementById('input-player-name');
    const name = inputElement.value.trim();
    if (!name) return;
    if (tempPlayers.includes(name)) { alert("Name already added!"); return; }

    tempPlayers.push(name);
    inputElement.value = ''; 
    renderPlayerTags();
}

function renderPlayerTags() {
    const previewDiv = document.getElementById('player-list-preview');
    previewDiv.innerHTML = '';
    if(tempPlayers.length === 0) {
        previewDiv.innerHTML = '<span style="color:var(--sub); font-size:13px; padding: 5px;">No players added yet.</span>';
        return;
    }
    tempPlayers.forEach((name, index) => {
        const tag = document.createElement('div');
        tag.className = 'player-tag';
        tag.innerHTML = `${name} <span class="remove-player" data-index="${index}">&times;</span>`;
        previewDiv.appendChild(tag);
    });
}

function initiateRace() {
    let customRoom = document.getElementById('input-room-id').value.trim().replace(/[^a-zA-NET0-9-_]/gi, '');
    locationName = document.getElementById('input-location').value.trim() || "Local Arena";
    raceTo = parseInt(document.getElementById('input-race').value);

    if (!customRoom) {
        alert("Silakan masukkan Room / Meja ID untuk sinkronisasi perangkat!");
        return;
    }
    if (tempPlayers.length === 0 || !raceTo) {
        alert("Please add players and set the target race!");
        return;
    }

    // Ubah URL secara instan tanpa memuat ulang layar agar link bisa dibagikan ke device lain
    window.history.pushState({}, '', `?room=${customRoom}`);
    roomId = customRoom;
    dbRoomPath = `billiard_live_scoreboard/${roomId}`;
    document.getElementById('room-indicator').innerText = `Room: ${roomId}`;

    const initialPlayers = tempPlayers.map((name, index) => ({ id: index, name: name, score: 0 }));

    set(ref(db, dbRoomPath), {
        locationName: locationName,
        raceTo: raceTo,
        playersData: initialPlayers,
        totalMatchPoints: 0,
        matchElapsedTime: 0,
        isTimerRunning: true,
        isGameOver: false
    }).then(() => {
        startListeningToFirebase();
    });
}

function renderCardsFromFirebase() {
    const container = document.getElementById('cards-container');
    container.innerHTML = '';
    playersData.forEach(player => {
        const card = document.createElement('div');
        
        let statusClass = "player-card";
        if (isGameOver && player.score >= raceTo) {
            statusClass += " winner";
        } else if (!isGameOver && player.score === (raceTo - 1)) {
            statusClass += " on-the-hill";
        }

        card.className = statusClass;
        card.innerHTML = `
            <div class="player-name">${player.name}</div>
            <div class="player-location">📍 ${locationName}</div>
            <div class="score-display">${player.score}</div>
            <button class="btn-score" data-id="${player.id}" ${isGameOver ? 'disabled' : ''}>+1 Point</button>
        `;
        container.appendChild(card);
    });
}

function formatTime(ms) {
    let minutes = Math.floor(ms / 60000);
    let seconds = Math.floor((ms % 60000) / 1000);
    let centiseconds = Math.floor((ms % 1000) / 10);
    return ((minutes < 10 ? "0" : "") + minutes + ":" + (seconds < 10 ? "0" : "") + seconds + "." + (centiseconds < 10 ? "0" : "") + centiseconds);
}

function formatAvgTime(ms) { return `${(ms / 1000).toFixed(2)}s`; }

function updateGlobalStatsUI() {
    const avgDisplay = document.getElementById('global-avg-value');
    if(avgDisplay) {
        avgDisplay.innerText = totalMatchPoints > 0 ? formatAvgTime(matchElapsedTime / totalMatchPoints) : "-";
    }
}

function addPoint(id) {
    if (isGameOver) return;

    const updatedPlayers = [...playersData];
    updatedPlayers[id].score++;
    const newTotalPoints = totalMatchPoints + 1;
    
    let checkGameOver = updatedPlayers[id].score >= raceTo;

    if (globalTimerInterval) {
        matchElapsedTime = Date.now() - matchStartTime;
    }

    update(ref(db, dbRoomPath), {
        playersData: updatedPlayers,
        totalMatchPoints: newTotalPoints,
        matchElapsedTime: matchElapsedTime,
        isGameOver: checkGameOver,
        isTimerRunning: !checkGameOver
    });

    if (checkGameOver) {
        setTimeout(() => { generateScreenshotAndShare(true); }, 800);
    }
}

function generateScreenshotAndShare(isAuto = false) {
    const target = document.getElementById('full-page-zone');
    if(!target) return;
    target.classList.add('hide-on-screenshot');
    
    html2canvas(target, {
        backgroundColor: getComputedStyle(document.body).getPropertyValue('--bg') || '#f5f5f7',
        scale: 2, 
        logging: false,
        useCORS: true
    }).then(canvas => {
        target.classList.remove('hide-on-screenshot');
        canvas.toBlob(blob => {
            const fileGambar = new File([blob], "billiard-live-result.png", { type: "image/png" });

            if (navigator.canShare && navigator.canShare({ files: [fileGambar] })) {
                navigator.share({
                    files: [fileGambar],
                    title: 'Billiard Match Result',
                    text: `Match Overview at ${locationName}. Target Race: ${raceTo}.`
                }).catch((error) => console.log('Sharing cancelled/failed', error));
            } else {
                if (!isAuto) {
                    const link = document.createElement('a');
                    link.download = 'billiard-live-result.png';
                    link.href = URL.createObjectURL(blob);
                    link.click();
                }
            }
        }, 'image/png');
    }).catch(err => {
        if(target) target.classList.remove('hide-on-screenshot');
        console.error("Screenshot failed:", err);
    });
}

function resetGame() {
    if(confirm("Are you sure you want to reset this match?")) {
        remove(ref(db, dbRoomPath)); 
        window.history.pushState({}, '', window.location.pathname);
        roomId = '';
        dbRoomPath = null;
        document.getElementById('room-indicator').innerText = `Room: Not Connected`;
        tempPlayers = [];
        renderPlayerTags();
    }
}

// BIND KLIK STATIS
document.getElementById('btn-add-player').onclick = addPlayerToList;
document.getElementById('btn-start-race').onclick = initiateRace;
document.getElementById('btn-reset').onclick = resetGame;
document.getElementById('btn-back').onclick = () => { window.location.href = "index.html"; };
document.getElementById('btn-share-node').onclick = () => generateScreenshotAndShare(false);

document.getElementById('input-player-name').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') addPlayerToList();
});

// CAPTURE KLIK DINAMIS (Anti-Error Modul)
document.addEventListener('click', function(e) {
    if(e.target && e.target.classList.contains('remove-player')) {
        const index = parseInt(e.target.getAttribute('data-index'));
        tempPlayers.splice(index, 1);
        renderPlayerTags();
    }
    if(e.target && e.target.classList.contains('btn-score')) {
        const id = parseInt(e.target.getAttribute('data-id'));
        addPoint(id);
    }
});

renderPlayerTags();
</script>
</body>
</html>
